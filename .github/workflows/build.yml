# Baut die Anwendung auf einem Windows-Runner, sobald ein Tag der Form v*
# gepusht wird, und legt ein GitHub-Release mit der fertigen EXE an.
# Gewöhnliche Pushes und Pull Requests lösen keinen Lauf aus; über den
# Actions-Tab lässt sich zusätzlich von Hand bauen (dann ohne Release,
# die EXE liegt als Artefakt am Lauf).
#
# Die Runner bringen MSVC, CMake und Ninja bereits mit. Was fehlt, ist die
# eingerichtete Compiler-Umgebung (vcvars), damit das Preset msvc-x64 sein
# cl.exe findet. Das erledigte frueher ilammy/msvc-dev-cmd; die Aktion wird
# seit 2024 nicht mehr gepflegt, blieb auf Node 20 stehen und wurde von GitHub
# nur noch ersatzweise ausgefuehrt. Sie ist durch das ersetzt, was sie tat --
# ein Aufruf von vcvars64. Das ist eine Fremdabhaengigkeit weniger in der
# Baukette und nichts, was noch einmal veralten kann.

name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # zum Anlegen des Release; für den reinen Bau ohne Belang

    steps:
      - uses: actions/checkout@v7

      # vswhere gehoert zum Visual-Studio-Installer und liegt auf jedem Runner
      # an derselben Stelle; es sagt, wohin die jeweils neueste Installation
      # geraten ist. vcvars64 richtet daraufhin Host und Ziel x64 ein.
      #
      # Was dabei gesetzt wird, gilt zunaechst nur in dieser cmd-Sitzung -- die
      # endet mit dem Schritt. Die vier Variablen, auf die es ankommt, wandern
      # deshalb nach GITHUB_ENV und stehen damit auch dem Konfigurieren und
      # Bauen zur Verfuegung. Umgeleitet wird vor dem echo: stuende ">>" hinter
      # einem Wert, der auf eine Ziffer endet, laese cmd sie als Nummer eines
      # Ausgabekanals.
      - name: MSVC-Umgebung einrichten
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo Keine Visual-Studio-Installation mit C++-Werkzeugen gefunden. & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          >>"%GITHUB_ENV%" echo PATH=%PATH%
          >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
          >>"%GITHUB_ENV%" echo LIB=%LIB%
          >>"%GITHUB_ENV%" echo LIBPATH=%LIBPATH%

      - name: Konfigurieren
        run: cmake --preset msvc-x64

      - name: Bauen (Release)
        run: cmake --build --preset release

      # Für von Hand gestartete Läufe (ohne Tag, also ohne Release) ist
      # das Artefakt der einzige Weg, an die gebaute EXE zu kommen.
      - name: Artefakt ablegen
        uses: actions/upload-artifact@v7
        with:
          name: Bildanzeige
          path: build/Release/Bildanzeige.exe

      # Die Lizenz haengt mit am Release: die EXE ist portabel und wandert
      # leicht allein weiter. Der Quelltext, den die GPL dazu verlangt, liegt
      # ohnehin als Archiv an jedem Tag -- das legt GitHub von selbst an.
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Release/Bildanzeige.exe
            LICENSE
          generate_release_notes: true
